<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Delivery</title>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head><body style="font-family:Arial;padding:15px">
<h2>Delivery - Fixed 4004</h2>
<input id="item" placeholder="Item" style="width:100%;padding:10px"><br><br>
<button onclick="pay()" style="background:#ff5722;color:#fff;padding:12px;width:100%;border:0;border-radius:8px">Pay ₹300</button>
<p id="status"></p>
<script>
function pay(){
 var options={
  "key": "rzp_test_1DP5mmOlF5G5ag", // Working Test Key
  "amount": "30000",
  "currency": "INR",
  "name": "Demo Delivery",
  "description": document.getElementById('item').value,
  "handler": function(res){ document.getElementById('status').innerText = "✅ Success: "+res.razorpay_payment_id; },
  "theme": {"color": "#ff5722"}
 };
 var rzp = new Razorpay(options);
 rzp.on('payment.failed', function (response){ alert("Error Code: "+response.error.code+" - "+response.error.description); });
 rzp.open();
}
</script></body></html>
