<script>
function pay(){
  let item = document.getElementById('item').value || 'Biryani';
  let amount = prompt("Enta amount pay cheyali? Ex: 300", "300");
  if(!amount) return;

  // Demo Payment Popup (Razorpay laga)
  let confirmPay = confirm(`Demo Payment\nItem: ${item}\nAmount: ₹${amount}\n\nPay Now click cheyi (Test Mode - Real money cut avvadu)`);
  
  if(confirmPay){
    // Payment Success Simulation
    document.getElementById('status').innerHTML = `
      <div style="background:#e8f5e9;padding:10px;border-radius:8px;margin-top:10px">
      ✅ <b>Payment Success (DEMO)</b><br>
      Amount: ₹${amount}<br>
      Item: ${item}<br>
      Txn ID: DEMO_${Date.now()}<br><br>
      <small>Real app lo idi Razorpay ki vellipothundi. Ippudu demo kabatti direct ga success ayindi.</small>
      </div>
    `;
    localStorage.setItem('order', item);
    localStorage.setItem('amount', amount);
    document.getElementById('orderItem').innerText = `${item} - ₹${amount}`;
    document.getElementById('riderItem').innerText = `${item} - ₹${amount}`;
    alert(`₹${amount} Paid Successfully! (Demo) \nReal lo Razorpay lo padtundi`);
  }
}
</script>
