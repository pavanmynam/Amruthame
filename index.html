<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Amruthame</title>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head><body style="font-family:Arial;padding:15px;background:#fff7f0">
<h2>🚚 Amruthame Delivery</h2>
<input id="item" placeholder="Em kavali? Biryani..." style="width:100%;padding:12px;border-radius:8px;border:1px solid #ccc"><br><br>
<button onclick="pay()" style="background:#ff5722;color:#fff;padding:14px;width:100%;border:0;border-radius:8px;font-size:16px;font-weight:bold">Pay ₹300 & Order</button>
<p id="status"></p>
<script>
function pay(){
 var options={
  "key": "rzp_test_1DP5mmOlF5G5ag",
  "amount": "30000",
  "currency": "INR",
  "name": "Amruthame",
  "description": document.getElementById('item').value||"Biryani",
  "handler": function(res){ document.getElementById('status').innerHTML="✅ Payment Success (Demo)<br>Txn ID: "+res.razorpay_payment_id+"<br>Order Shop ki vellindi!"; },
  "theme": {"color": "#ff5722"}
 };
 var rzp=new Razorpay(options); rzp.open();
}
</script>
</body></html>
